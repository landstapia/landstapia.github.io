  <link href="https://fonts.googleapis.com/css2?family=Arvo&display=swap" rel="stylesheet">

<body>
  <div id="wrapper">
    <div id="lyrics" class="arial"></div>
    <div id="lyrics-sub" class="arial"></div>
  </div>

  <div id="settings" class="messenger-menu">
    <div class="container">        
      <div class="columns is-mobile is-vcentered is-variable is-2">

        <div class="column">
          <div class="field">
            <label class="label">Content:</label>
            <input class="file-input" type="file" id="open_lyrics_file">
            <button class="messenger-btn" onclick="document.getElementById('open_lyrics_file').click()">
              Select File
            </button>
            <p class="help-text">Click to select mark-up file.</p>
          </div>
        </div>

        <div class="column">
          <div class="field">
            <label class="label is-small">Background:</label>
            <div class="control select-wrapper">
              <select id="bg-color" class="messenger-select">
                <option value="rgba(0,0,0,0)">⚪ Transparent</option>
                <option value="rgba(255,0,0,1)">🔴 Red</option>
                <option value="rgba(0,255,0,1)">🟢 Green</option>
                <option value="rgba(0,0,255,1)">🔵 Blue</option>
                <option value="rgba(0,0,0,1)">⚫ Black</option>
              </select>
            </div>
            <p class="help-text">&nbsp;</p>
          </div>
        </div>

        <div class="column">
          <div class="field">
            <label class="label is-small">Text Color:</label>
            <div class="control select-wrapper">
              <select id="text-color" class="messenger-select">
                <option value="#ffffff">⚪ White</option>
                <option value="#000000">⚫ Black</option>
                <option value="#ffeb3b">🟡 Yellow</option>
              </select>
            </div>
            <p class="help-text">&nbsp;</p>
          </div>
        </div>

        <div class="column">
          <div class="field">
            <label class="label is-small">Font:</label>
            <div class="control select-wrapper">
              <select id="text-font" class="messenger-select">
                <option value="arial" class="arial">Arial</option>
                <option value="atma" class="atma">Atma</option>
                <option value="birthstone" class="birthstone">Birthstone</option>
                <option value="cookie" class="cookie">Cookie</option>
                <option value="englebert" class="englebert">Englebert</option>
                <option value="ms-madi" class="ms-madi">Ms Madi</option>
                <option value="pattaya" class="pattaya">Pattaya</option>
                <option value="rouge-script" class="rouge-script">Rouge Script</option>
                <option value="sriracha" class="sriracha">Sriracha</option>
                <option value="story-script" class="story-script">Story Script</option>
                <option value="fleur-de-leah" class="fleur-de-leah">Fleur De Leah</option>
                <option value="titan-one" class="titan-one">Titan One</option>
                <option value="emilys-candy" class="emilys-candy">Emilys Candy</option>
                <option value="montserrat" class="montserrat">Montserrat</option>
                <option value="satisfy" class="satisfy">Satisfy</option>
                <option value="permanent-marker" class="permanent-marker">Permanent Marker</option>
                <option value="bebas-neue" class="bebas-neue">Bebas Neue</option>
                <option value="caveat" class="caveat">Caveat</option>
                <option value="playfair-display" class="playfair-display">Playfair Display</option>
                <option value="inter" class="inter">Inter</option>
                <option value="space-grotesk" class="space-grotesk">Space Grotesk</option>
                <option value="cinzel" class="cinzel">Cinzel</option>
                <option value="raleway" class="raleway">Raleway</option>
                <option value="quicksand" class="quicksand">Quicksand</option>
                <option value="dm-sans" class="dm-sans">DM Sans</option>
                <option value="dynapuff" class="dynapuff">DynaPuff</option>
                <option value="sniglet" class="sniglet">Sniglet</option>
                <option value="great-vibes" class="great-vibes">Great Vibes</option>
                <option value="lobster" class="lobster">Lobster</option>
                <option value="libre-baskerville" class="libre-baskerville">Baskerville</option>
                <option value="cormorant" class="cormorant">Cormorant</option>
                <option value="marcellus" class="marcellus">Marcellus</option>
                <option value="italiana" class="italiana">Italiana</option>
                <option value="medula-one" class="medula-one">Medula One</option>
                <option value="yeseva-one" class="yeseva-one">Yeseva One</option>
                <option value="shadows-light" class="shadows-light">Shadows Light</option>
                <option value="indie-flower" class="indie-flower">Indie Flower</option>
                <option value="teko" class="teko">Teko</option>
                <option value="pathway-gothic" class="pathway-gothic">Pathway Gothic</option>
                <option value="arvo" class="arvo">Arvo</option>
                <option value="roboto-slab" class="roboto-slab">Roboto Slab</option>
                <option value="zilla-slab" class="zilla-slab">Zilla Slab</option>
                <option value="lexend" class="lexend">Lexend</option>
                <option value="syncopate" class="syncopate">Syncopate</option>
                <option value="outfit" class="outfit">Outfit</option>
                <option value="bungee-shade" class="bungee-shade">Bungee Shade</option>
                <option value="monoton" class="monoton">Monoton</option>
                <option value="staatliches" class="staatliches">Staatliches</option>
                <option value="bangers" class="bangers">Bangers</option>
                <option value="tenor-sans" class="tenor-sans">Tenor Sans</option>
                <option value="forum" class="forum">Forum</option>
                <option value="prata" class="prata">Prata</option>
                <option value="comfortaa" class="comfortaa">Comfortaa</option>
                <option value="modak" class="modak">Modak</option>
              </select>
            </div>
            <p class="help-text">Press <code>F</code> to navigate fonts.</p>
          </div>
        </div>

        <div class="column">
          <div class="field">
            <label class="label is-small">Transition:</label>
            <div class="control select-wrapper">
              <select id="transition-type" class="messenger-select">
                <option value="lyricSwap">Scale Swap</option>
                <option value="fadeOnly">Simple Fade</option>
                <option value="slideUp">Slide Up</option>
                <option value="slideDown">Slide Down</option>
                <option value="zoomIn">Zoom In</option>
                <option value="flipX">Flip 3D</option>
                <option value="rotateIn">Rotate</option>
                <option value="blurFade">Glass Blur</option>
                <option value="roll3D">3D Roll</option>
                <option value="doorLeft">Door Swing</option>
                <option value="newspaper">Newspaper</option>
                <option value="cubeSpin">3D Cube</option>
                <option value="splitReveal">Split</option>
                <option value="diagWipe">Diagonal Wipe</option>
              </select>
            </div>
            <p class="help-text">Press <code>T</code> to change entry.</p>
          </div>
        </div>

        <div class="column">
          <div class="field">
            <label class="label is-small">Speed (ms):</label>
            <div class="control select-wrapper">
              <input type="number" id="speed-ms" class="messenger-select" value="800" min="0" max="1500" step="50">
            </div>
            <p class="help-text">Set 0 to 1500ms.</p>
          </div>
        </div>

        <div class="column">
          <div class="field">
            <label class="label is-small">Zoom:</label>
            <div class="buttons are-small has-addons" style="margin: 0;">
              <button class="button is-dark messenger-btn-circle" id="zoom-up">
                <i class="fas fa-plus"></i>
              </button>
              <button class="button is-dark messenger-btn-circle" id="zoom-down">
                <i class="fas fa-minus"></i>
              </button>
            </div>
            <p class="help-text">Press <code>+</code>/<code>-</code> size.</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
